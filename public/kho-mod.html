<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kho Mod MCPE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
  <header class="border-b border-gray-800 bg-gray-900/70 backdrop-blur sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <a href="/" class="text-xs text-gray-400 hover:text-emerald-300"><i class="fa-solid fa-arrow-left mr-1"></i>Trang dịch mod</a>
      <h1 class="text-lg font-bold text-white"><i class="fa-solid fa-store text-emerald-400 mr-2"></i>Kho Mod</h1>
      <div class="flex items-center gap-2">
        <button id="btnCreateMod" type="button" class="hidden px-3 py-1.5 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-gray-950 text-xs font-bold"><i class="fa-solid fa-plus mr-1"></i>Tạo vật phẩm</button>
        <button id="btnAdminLogin" type="button" class="px-3 py-1.5 rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs font-semibold">Admin</button>
        <button id="btnAdminLogout" type="button" class="hidden px-3 py-1.5 rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs font-semibold">Đăng xuất</button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-6 space-y-4">
    <p id="modEmpty" class="text-center text-sm text-gray-400 py-10"></p>
    <div id="modGrid" class="grid grid-cols-1 gap-2"></div>
    <p class="text-[11px] text-gray-500">Bấm vào vật phẩm để mở đường link tải. Chỉ tải từ nguồn bạn tin tưởng.</p>
  </main>

  <!-- Đăng nhập admin -->
  <div id="adminLoginModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-950/80 backdrop-blur-sm">
    <form id="adminLoginForm" class="w-full max-w-sm bg-gray-900 border border-gray-800 rounded-2xl p-5 space-y-3 shadow-2xl">
      <div class="flex items-center justify-between">
        <h3 class="text-lg font-bold text-white">Đăng nhập admin</h3>
        <button id="btnCloseAdminLogin" type="button" class="w-8 h-8 rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-300"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <input id="adminEmail" type="email" placeholder="Email" autocomplete="username" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-400">
      <input id="adminPassword" type="password" placeholder="Mật khẩu" autocomplete="current-password" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-400">
      <p id="adminLoginError" class="text-xs text-red-400 min-h-[1rem]"></p>
      <button type="submit" class="w-full py-2.5 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-gray-950 font-bold text-sm">Đăng nhập</button>
    </form>
  </div>

  <!-- Tạo vật phẩm (chỉ admin) -->
  <div id="modCreateModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-950/80 backdrop-blur-sm overflow-y-auto">
    <form id="modCreateForm" class="w-full max-w-md bg-gray-900 border border-gray-800 rounded-2xl p-5 space-y-3 shadow-2xl">
      <div class="flex items-center justify-between">
        <h3 class="text-lg font-bold text-white">Tạo vật phẩm</h3>
        <button id="btnCloseModCreate" type="button" class="w-8 h-8 rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-300"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div>
        <label for="modNameInput" class="block text-xs font-semibold text-gray-300 uppercase mb-1">Tên vật phẩm</label>
        <input id="modNameInput" type="text" maxlength="80" autocomplete="off" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-400">
      </div>
      <div>
        <label for="modImageInput" class="block text-xs font-semibold text-gray-300 uppercase mb-1">Ảnh vật phẩm</label>
        <input id="modImageInput" type="file" accept="image/*" class="w-full text-xs text-gray-300 file:mr-3 file:px-3 file:py-2 file:rounded-lg file:border-0 file:bg-gray-800 file:text-gray-200">
        <img id="modImagePreview" alt="Xem trước" class="hidden mt-2 w-24 h-24 rounded-lg object-cover border border-gray-700">
      </div>
      <div>
        <label for="modLinkInput" class="block text-xs font-semibold text-gray-300 uppercase mb-1">Đường link tải vật phẩm</label>
        <input id="modLinkInput" type="url" placeholder="https://..." autocomplete="off" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-400">
      </div>
      <p id="modCreateError" class="text-xs text-red-400 min-h-[1rem]"></p>
      <button id="modSaveBtn" type="submit" class="w-full py-2.5 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-gray-950 font-bold text-sm">Lưu</button>
    </form>
  </div>

  <script src="modstore.js?v=3"></script>
</body>
</html>
