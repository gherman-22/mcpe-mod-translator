services:
  - type: web
    name: mcpe-mod-translator
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: JWT_SECRET
        value: mcpe-translator-secret-key-permanent-2026-production
      - key: MONGODB_URI
        sync: false
